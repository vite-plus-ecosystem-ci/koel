name: Frontend Unit Tests
on:
  pull_request:
    branches:
      - master
    paths:
      - resources/assets/**
      - package.json
      - .github/workflows/unit-frontend.yml
  push:
    branches:
      - master
      - next
    paths:
      - resources/assets/**
      - package.json
      - .github/workflows/unit-frontend.yml
  workflow_dispatch:

env:
  LARAVEL_BYPASS_ENV_CHECK: 1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 22 ]
        shard: [ 1/3, 2/3, 3/3 ]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm exec vp test --run --shard=${{ matrix.shard }}

  control:
    name: Previous release control (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1/3, 2/3, 3/3 ]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: pnpm
      - name: Select previous release
        run: sed -i 's/0.0.0-commit.fba044cf40fea5a7bf4a2ee97822f174eab33dfa/0.3.2/g' pnpm-workspace.yaml
      - name: Install previous release
        run: pnpm install --no-frozen-lockfile
      - name: Verify control and run unit tests
        run: |
          pnpm exec vp --version
          pnpm exec vp test --run --shard=${{ matrix.shard }}
